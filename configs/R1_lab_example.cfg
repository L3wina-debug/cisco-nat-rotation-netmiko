! Example GNS3 lab configuration for the edge router (R1), Cisco IOS.
! Interface names and addresses match the lab used in the report; adapt them.
! Replace <USERNAME> and <PASSWORD> before use. Never commit real credentials.
!
hostname R1
ip domain-name lab.local
username <USERNAME> privilege 15 secret <PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 4
 login local
 transport input ssh
!
interface FastEthernet0/0
 description LAN (management + inside hosts)
 ip address 192.168.174.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface FastEthernet0/1
 description WAN (public range used by the NAT pool)
 ip address 100.10.10.254 255.255.255.0
 ip nat outside
 no shutdown
!
access-list 1 permit 192.168.174.0 0.0.0.255
!
! The script manages this pool; it starts on the first address of the range.
ip nat pool NET 100.10.10.1 100.10.10.1 netmask 255.255.255.0
ip nat inside source list 1 pool NET overload
